<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script>(function(){var t=localStorage.getItem('theme');if(t==='dark'||(!t&&window.matchMedia('(prefers-color-scheme: dark)').matches)){document.documentElement.classList.add('dark')}})();</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Meeting Copilot — Access</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', system-ui, sans-serif; background: #f4f5f7; min-height: 100vh; display: flex; flex-direction: column; }
    header { display: flex; align-items: center; justify-content: space-between; padding: 14px 28px; border-bottom: 1px solid #dde1e7; background: #fff; }
    .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: inherit; }
    .brand-title { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; color: #1a1f2b; text-transform: uppercase; }
    .brand-sub { font-size: 10px; color: #8a95a5; letter-spacing: 0.1em; text-transform: uppercase; }
    .theme-toggle { background: none; border: 1px solid #dde1e7; border-radius: 4px; padding: 4px 10px; cursor: pointer; font-size: 11px; color: #8a95a5; }
    main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 48px 20px; }
    .card { background: #fff; border: 1px solid #dde1e7; border-radius: 8px; padding: 44px 40px; width: 100%; max-width: 380px; box-shadow: 0 2px 12px rgba(0,0,0,0.07); }
    .card-eyebrow { font-size: 10px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #8a95a5; margin-bottom: 12px; }
    h1 { font-size: 19px; font-weight: 700; color: #1a1f2b; margin-bottom: 6px; letter-spacing: -0.01em; }
    p { font-size: 13px; color: #6e7a8a; margin-bottom: 28px; line-height: 1.5; }
    .field-label { display: block; font-size: 11px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: #525d6e; margin-bottom: 6px; }
    .input-wrap { position: relative; margin-bottom: 16px; }
    .input-wrap input { width: 100%; padding: 11px 40px 11px 14px; border: 1px solid #dde1e7; border-radius: 4px; font-size: 13px; outline: none; font-family: 'JetBrains Mono', 'SF Mono', monospace; letter-spacing: 0.06em; color: #1a1f2b; background: #fcfcfd; box-sizing: border-box; margin-bottom: 0; }
    .input-wrap input:focus { border-color: #2d4a6e; box-shadow: 0 0 0 3px rgba(45,74,110,0.1); background: #fff; }
    .eye-toggle { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; padding: 4px; color: #8a95a5; display: flex; align-items: center; }
    .eye-toggle:hover { color: #525d6e; }
    html.dark .eye-toggle { color: #5c6678; }
    html.dark .eye-toggle:hover { color: #8a95a5; }
    button[type="submit"] { width: 100%; padding: 11px; border: none; border-radius: 4px; background: #1e3a5f; color: #fff; font-size: 13px; font-weight: 600; cursor: pointer; letter-spacing: 0.02em; }
    button[type="submit"]:hover { background: #16305a; }
    .error { color: #b83b3b; font-size: 12px; margin-bottom: 12px; display: none; }
    footer { display: flex; justify-content: space-between; align-items: center; padding: 14px 28px; border-top: 1px solid #dde1e7; background: #fff; font-size: 10px; color: #8a95a5; letter-spacing: 0.03em; }
    html.dark body { background: #080c14; }
    html.dark header, html.dark footer { background: #0e1117; border-color: #1e2a3a; }
    html.dark .brand-title { color: #e8ecf0; }
    html.dark .brand-sub { color: #5c6678; }
    html.dark .theme-toggle { border-color: #1e2a3a; color: #5c6678; }
    html.dark .card { background: #111822; border-color: #1e2a3a; }
    html.dark h1 { color: #e8ecf0; }
    html.dark p { color: #8a95a5; }
    html.dark .card-eyebrow { color: #5c6678; }
    html.dark .field-label { color: #8a95a5; }
    html.dark input { background: #0c1017; border-color: #1e2a3a; color: #e8ecf0; }
    html.dark input:focus { border-color: #4a7fa5; box-shadow: 0 0 0 3px rgba(74,127,165,0.15); background: #0e1420; }
    html.dark button[type="submit"] { background: #1e3a5f; }
    html.dark button[type="submit"]:hover { background: #162e4e; }
    html.dark footer { color: #5c6678; }
  </style>
</head>
<body>
  <header>
    <a href="/" class="brand">
      <div>
        <div class="brand-title">AI MEETING COPILOT</div>
        <div class="brand-sub">RESEARCH & ANALYSIS</div>
      </div>
    </a>
    <button class="theme-toggle" onclick="document.documentElement.classList.toggle('dark'); localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light'); this.textContent = document.documentElement.classList.contains('dark') ? '&#9728; Light' : '&#9790; Dark';">&#711; Dark</button>
  </header>
  <main>
    <div class="card">
      <div class="card-eyebrow">Restricted Access</div>
      <h1>AI Meeting Copilot</h1>
      <p>Enter your access token to continue.</p>
      <div class="error" id="error">Invalid token. Please try again.</div>
      <form id="form">
        <label class="field-label" for="token">Access Token</label>
        <div class="input-wrap">
          <input type="text" id="token" placeholder="" autocomplete="off" autofocus>
          <button type="button" class="eye-toggle" id="eyeToggle" title="Hide token">
            <svg id="eyeOpen" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>
            <svg id="eyeClosed" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"/><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"/><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.749 10.749 0 0 1 4.446-5.143"/><path d="m2 2 20 20"/></svg>
          </button>
        </div>
        <button type="submit">Continue</button>
      </form>
    </div>
  </main>
  <footer>
    <span>&copy; 2026 AI Meeting Copilot. All rights reserved.</span>
    <span>Startup Weekend Orlando 2026</span>
  </footer>
  <script>
    if (localStorage.getItem('theme') === 'dark') {
      document.documentElement.classList.add('dark');
      document.querySelector('.theme-toggle').textContent = '\u2600 Light';
    }
    document.getElementById('eyeToggle').addEventListener('click', function() {
      var input = document.getElementById('token');
      var open = document.getElementById('eyeOpen');
      var closed = document.getElementById('eyeClosed');
      if (input.type === 'text') {
        input.type = 'password';
        open.style.display = 'none';
        closed.style.display = '';
        this.title = 'Show token';
      } else {
        input.type = 'text';
        open.style.display = '';
        closed.style.display = 'none';
        this.title = 'Hide token';
      }
    });
    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const token = document.getElementById('token').value.trim();
      if (!token) return;
      try {
        const res = await fetch('/api/auth', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token })
        });
        if (res.ok) { window.location.href = '/'; }
        else { document.getElementById('error').style.display = 'block'; document.getElementById('token').value = ''; document.getElementById('token').focus(); }
      } catch { document.getElementById('error').style.display = 'block'; }
    });
  </script>
</body>
</html>
